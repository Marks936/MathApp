<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e0f7fa">
    <title>Админ Панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- 1. ЭКРАН ВХОДА -->
        <div id="admin-login-screen" class="screen active">
            <div class="emoji">🔐</div>
            <h1>Вход для админа</h1>
            <div class="input-area" style="margin-top: 20px;">
                <input type="text" id="admin-user" placeholder="Логин" autocomplete="off">
                <input type="password" id="admin-pass" placeholder="Пароль">
                <button onclick="checkAdminLogin()" class="btn submit-btn">Войти</button>
                <p id="login-error" style="color: #e74c3c; font-weight: bold; margin-top: 10px;"></p>
            </div>
            <a href="index.html" class="btn" style="background: #bdc3c7; color: white; margin-top: 20px; text-decoration: none;">Назад в игру</a>
        </div>

        <!-- 2. ПАНЕЛЬ АДМИНА -->
        <div id="admin-panel-screen" class="screen">
            <h1>Результаты 📊</h1>
            <div id="admin-results-list" class="results-list">
                <!-- Результаты будут загружаться сюда -->
            </div>
            <button onclick="clearAdminResults()" class="btn hard-btn" style="margin-bottom: 15px;">Очистить историю</button>
            <a href="index.html" class="btn submit-btn" style="text-decoration: none;">Выйти в игру</a>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
